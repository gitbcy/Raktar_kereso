name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt letöltése
        uses: actions/checkout@v4

      - name: Java 17 telepítése
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle Wrapper generálása
        run: gradle wrapper --gradle-version 8.7

      - name: Gradle futtatási jog beállítása
        run: chmod +x gradlew

      - name: Debug APK elkészítése
        run: ./gradlew assembleDebug

      - name: APK feltöltése letöltéshez
        uses: actions/upload-artifact@v4
        with:
          name: Raktar-Kereso-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
